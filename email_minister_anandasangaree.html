%20are%20being%20drawn%20into%20these%20proceedings%20and%20facing%20profound%20uncertainty%20about%20their%20families%E2%80%99%20future%20in%20Canada.%0A%0AWe%20are%20deeply%20concerned%20that%20individuals%20who%20were%20themselves%20victims%20of%20a%20system%20that%20compelled%20them%20to%20serve%20are%20being%20treated%20as%20security%20threats%20based%20primarily%20on%20that%20compulsory%20service.%0A%0AWe%20respectfully%20urge%20you%20to%20provide%20clear%20guidance%20distinguishing%20former%20compulsory%20conscripts%20from%20individuals%20who%20voluntarily%20joined%2C%20supported%2C%20or%20participated%20in%20the%20IRGC.%20Such%20guidance%20would%20help%20ensure%20that%20enforcement%20remains%20focused%20on%20genuine%20security%20risks%20while%20preventing%20disproportionate%20consequences%20for%20innocent%20people.%0A%0AWe%20also%20urge%20your%20department%20to%20ensure%20that%20its%20approach%20does%20not%20impose%20severe%20and%20disproportionate%20consequences%20on%20thousands%20of%20families%20and%20their%20children%20solely%20because%20of%20mandatory%20conscription.%0A%0ANational%20security%20and%20fairness%20should%20not%20be%20opposing%20goals%3B%20Canada%20can%20protect%20both.%0A%0AThank%20you%20for%20your%20attention%20to%20this%20urgent%20matter%20and%20for%20your%20commitment%20to%20keeping%20Canadians%20safe%20while%20ensuring%20that%20our%20laws%20are%20applied%20fairly%2C%20proportionately%2C%20and%20effectively.%0A%0ASincerely%2C%0A%5BYour%20Name%5D%0A";
