9D%90%A7%F0%9D%90%9C%F0%9D%90%9E%2C%20meaning%20Iranian%20men%20required%20to%20perform%20mandatory%20conscription%20in%20IRGC%20units%20are%20%F0%9D%90%A7%F0%9D%90%A8%F0%9D%90%AD%20%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A6%F0%9D%90%A2%F0%9D%90%A7%F0%9D%90%9A%F0%9D%90%A5%F0%9D%90%A2%F0%9D%90%B3%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%AC%F0%9D%90%A2%F0%9D%90%A6%F0%9D%90%A9%F0%9D%90%A5%F0%9D%90%B2%20%F0%9D%90%9B%F0%9D%90%9E%F0%9D%90%9C%F0%9D%90%9A%F0%9D%90%AE%F0%9D%90%AC%F0%9D%90%9E%20%F0%9D%90%A8%F0%9D%90%9F%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9A%F0%9D%90%AD%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A6%F0%9D%90%A9%F0%9D%90%AE%F0%9D%90%A5%F0%9D%90%AC%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%B2%20%F0%9D%90%AC%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%AF%F0%9D%90%A2%F0%9D%90%9C%F0%9D%90%9E.%0A%0AWave%20of%20Iran%20plots%20drove%20UK%20action%20against%20IRGC%2C%20terror%20law%20tsar%20says%20%28July%2015%2C%202026%29%0Ahttps%3A//www.iranintl.com/en/202607154486%0A%0ASimilarly%2C%20Australia%20distinguishes%20between%20individuals%20who%20were%20compelled%20to%20complete%20mandatory%20conscription%20and%20those%20who%20voluntarily%20joined%20or%20actively%20supported%20the%20IRGC.%20The%20Australian%20Government%27s%20response%20to%20the%20Parliamentary%20Joint%20Committee%20on%20Intelligence%20and%20Security%27s%20Review%20of%20the%20listing%20of%20the%20Islamic%20Revolutionary%20Guard%20Corps%20as%20a%20terrorist%20organization%20under%20the%20Criminal%20Code%20is%20available%20here%20for%20your%20reference%3A%0Ahttps%3A//www.homeaffairs.gov.au/reports-and-pubs/files/government-response-pjcis-review.pdf%0A%0AUnfortunately%2C%20this%20is%20not%20the%20experience%20of%20many%20former%20Iranian%20conscripts%20in%20Canada.%0A%0AWhen%20the%20Government%20of%20Canada%20listed%20the%20IRGC%20as%20a%20terrorist%20entity%2C%20%F0%9D%90%82%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%9A%F0%9D%90%9D%F0%9D%90%A2%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%AC%20%F0%9D%90%B0%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%9E%20%F0%9D%90%9A%F0%9D%90%AC%F0%9D%90%AC%F0%9D%90%AE%F0%9D%90%AB%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9A%F0%9D%90%AD%20%F0%9D%90%9F%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%AB%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A9%F0%9D%90%AD%F0%9D%90%AC%20%F0%9D%90%B0%F0%9D%90%A8%F0%9D%90%AE%F0%9D%90%A5%F0%9D%90%9D%20%F0%9D%90%A7%F0%9D%90%A8%F0%9D%90%AD%20%F0%9D%90%9B%F0%9D%90%9E%20%F0%9D%90%9A%F0%9D%90%AE%F0%9D%90%AD%F0%9D%90%A8%F0%9D%90%A6%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%9C%F0%9D%90%9A%F0%9D%90%A5%F0%9D%90%A5%F0%9D%90%B2%20%F0%9D%90%9A%F0%9D%90%9F%F0%9D%90%9F%F0%9D%90%9E%F0%9D%90%9C%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%9D%20and%20that%20each%20case%20would%20be%20assessed%20individually.%20However%2C%20many%20former%20conscripts%20are%20now%20receiving%20Procedural%20Fairness%20Letters%20and%20inadmissibility%20decisions%20in%20which%20immigration%20officers%20explicitly%20state%20that%20%F0%9D%90%A6%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%9D%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%B2%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A9%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%A8%F0%9D%90%A7%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%AE%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%AC%20%22%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%A6%F0%9D%90%9B%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%AC%F0%9D%90%A1%F0%9D%90%A2%F0%9D%90%A9%22%20%F0%9D%90%A2%F0%9D%90%A7%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9E%20%F0%9D%90%88%F0%9D%90%91%F0%9D%90%86%F0%9D%90%82.%0A%0AIn%20my%20case%2C%20I%20never%20chose%20to%20join%20the%20IRGC.%20Like%20every%20Iranian%20man%2C%20I%20was%20legally%20required%20to%20complete%20mandatory%20conscription.%20My%20assignment%20was%20determined%20by%20the%20military%20authorities%2C%20and%20I%20had%20no%20ability%20to%20choose%20where%20I%20served%20or%20to%20refuse%20my%20assignment.%20I%20had%20no%20ideological%20affiliation%20with%2C%20or%20loyalty%20to%2C%20the%20IRGC.%20Yet%20today%2C%20decades%20later%2C%20that%20compulsory%20conscription%20is%20being%20treated%20as%20though%20I%20voluntarily%20became%20a%20member%20of%20a%20terrorist%20organization.%0A%0AThis%20approach%20appears%20inconsistent%20with%20the%20Government%27s%20public%20commitment%20to%20individualized%2C%20case-by-case%20assessments%20and%20differs%20significantly%20from%20the%20balanced%20approaches%20adopted%20by%20the%20United%20Kingdom%20and%20Australia.%0A%0AI%20fully%20support%20Canada%27s%20efforts%20to%20protect%20national%20security.%20Those%20who%20voluntarily%20joined%20the%20IRGC%20or%20committed%20crimes%20should%20be%20thoroughly%20investigated%20and%20held%20accountable.%20However%2C%20I%20respectfully%20ask%20that%20I%20be%20assessed%20based%20on%20my%20own%20conduct%2C%20rather%20than%20having%20compulsory%20conscription%20treated%20as%20proof%20of%20IRGC%20membership.%0A%0AI%20respectfully%20request%20that%20your%20department%3A%0A%0A-%20Clarify%20that%20mandatory%20conscription%20alone%20does%20not%20establish%20membership%20in%20the%20IRGC.%0A-%20Ensure%20immigration%20officers%20distinguish%20between%20compulsory%20conscription%20and%20voluntary%20membership%20or%20meaningful%20participation%20in%20the%20IRGC.%0A-%20Review%20cases%20in%20which%20former%20conscripts%20have%20been%20found%20inadmissible%20solely%20because%20of%20mandatory%20conscription%20to%20ensure%20that%20Canada%27s%20commitment%20to%20individualized%20assessments%20is%20being%20applied%20consistently.%0A%0ACanada%20has%20long%20been%20recognized%20for%20its%20commitment%20to%20justice%2C%20fairness%2C%20and%20the%20rule%20of%20law.%20I%20respectfully%20ask%20that%20these%20principles%20continue%20to%20guide%20the%20implementation%20of%20the%20IRGC%20listing%20so%20that%20those%20who%20were%20compelled%20to%20serve%20under%20an%20authoritarian%20regime%20are%20not%20treated%20the%20same%20as%20those%20who%20willingly%20chose%20to%20support%20it.%0A%0AThank%20you%20for%20your%20time%20and%20consideration.%20I%20would%20be%20grateful%20for%20any%20assistance%20you%20can%20provide%20and%20would%20welcome%20the%20opportunity%20to%20discuss%20my%20situation%20further.%0A%0ASincerely%2C%0A%5BYour%20Name%5D%0A";
      };

%9C%F0%9D%90%9E%2C%20meaning%20Iranian%20men%20required%20to%20perform%20mandatory%20conscription%20in%20IRGC%20units%20are%20%F0%9D%90%A7%F0%9D%90%A8%F0%9D%90%AD%20%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A6%F0%9D%90%A2%F0%9D%90%A7%F0%9D%90%9A%F0%9D%90%A5%F0%9D%90%A2%F0%9D%90%B3%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%AC%F0%9D%90%A2%F0%9D%90%A6%F0%9D%90%A9%F0%9D%90%A5%F0%9D%90%B2%20%F0%9D%90%9B%F0%9D%90%9E%F0%9D%90%9C%F0%9D%90%9A%F0%9D%90%AE%F0%9D%90%AC%F0%9D%90%9E%20%F0%9D%90%A8%F0%9D%90%9F%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9A%F0%9D%90%AD%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A6%F0%9D%90%A9%F0%9D%90%AE%F0%9D%90%A5%F0%9D%90%AC%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%B2%20%F0%9D%90%AC%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%AF%F0%9D%90%A2%F0%9D%90%9C%F0%9D%90%9E.%0A%0AWave%20of%20Iran%20plots%20drove%20UK%20action%20against%20IRGC%2C%20terror%20law%20tsar%20says%20%28July%2015%2C%202026%29%0Ahttps%3A//www.iranintl.com/en/202607154486%0A%0ASimilarly%2C%20Australia%20distinguishes%20between%20individuals%20who%20were%20compelled%20to%20complete%20mandatory%20conscription%20and%20those%20who%20voluntarily%20joined%20or%20actively%20supported%20the%20IRGC.%20The%20Australian%20Government%27s%20response%20to%20the%20Parliamentary%20Joint%20Committee%20on%20Intelligence%20and%20Security%27s%20Review%20of%20the%20listing%20of%20the%20Islamic%20Revolutionary%20Guard%20Corps%20as%20a%20terrorist%20organization%20under%20the%20Criminal%20Code%20is%20available%20here%20for%20your%20reference%3A%0Ahttps%3A//www.homeaffairs.gov.au/reports-and-pubs/files/government-response-pjcis-review.pdf%0A%0AUnfortunately%2C%20this%20is%20not%20the%20experience%20of%20many%20former%20Iranian%20conscripts%20in%20Canada.%0A%0AWhen%20the%20Government%20of%20Canada%20listed%20the%20IRGC%20as%20a%20terrorist%20entity%2C%20%F0%9D%90%82%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%9A%F0%9D%90%9D%F0%9D%90%A2%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%AC%20%F0%9D%90%B0%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%9E%20%F0%9D%90%9A%F0%9D%90%AC%F0%9D%90%AC%F0%9D%90%AE%F0%9D%90%AB%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9A%F0%9D%90%AD%20%F0%9D%90%9F%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%AB%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A9%F0%9D%90%AD%F0%9D%90%AC%20%F0%9D%90%B0%F0%9D%90%A8%F0%9D%90%AE%F0%9D%90%A5%F0%9D%90%9D%20%F0%9D%90%A7%F0%9D%90%A8%F0%9D%90%AD%20%F0%9D%90%9B%F0%9D%90%9E%20%F0%9D%90%9A%F0%9D%90%AE%F0%9D%90%AD%F0%9D%90%A8%F0%9D%90%A6%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%9C%F0%9D%90%9A%F0%9D%90%A5%F0%9D%90%A5%F0%9D%90%B2%20%F0%9D%90%9A%F0%9D%90%9F%F0%9D%90%9F%F0%9D%90%9E%F0%9D%90%9C%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%9D%20and%20that%20each%20case%20would%20be%20assessed%20individually.%20However%2C%20many%20former%20conscripts%20are%20now%20receiving%20Procedural%20Fairness%20Letters%20and%20inadmissibility%20decisions%20in%20which%20immigration%20officers%20explicitly%20state%20that%20%F0%9D%90%A6%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%9D%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%B2%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A9%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%A8%F0%9D%90%A7%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%AE%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%AC%20%22%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%A6%F0%9D%90%9B%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%AC%F0%9D%90%A1%F0%9D%90%A2%F0%9D%90%A9%22%20%F0%9D%90%A2%F0%9D%90%A7%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9E%20%F0%9D%90%88%F0%9D%90%91%F0%9D%90%86%F0%9D%90%82.%0A%0AIn%20my%20case%2C%20I%20never%20chose%20to%20join%20the%20IRGC.%20Like%20every%20Iranian%20man%2C%20I%20was%20legally%20required%20to%20complete%20mandatory%20conscription.%20My%20assignment%20was%20determined%20by%20the%20military%20authorities%2C%20and%20I%20had%20no%20ability%20to%20choose%20where%20I%20served%20or%20to%20refuse%20my%20assignment.%20I%20had%20no%20ideological%20affiliation%20with%2C%20or%20loyalty%20to%2C%20the%20IRGC.%20Yet%20today%2C%20decades%20later%2C%20that%20compulsory%20conscription%20is%20being%20treated%20as%20though%20I%20voluntarily%20became%20a%20member%20of%20a%20terrorist%20organization.%0A%0AThis%20approach%20appears%20inconsistent%20with%20the%20Government%27s%20public%20commitment%20to%20individualized%2C%20case-by-case%20assessments%20and%20differs%20significantly%20from%20the%20balanced%20approaches%20adopted%20by%20the%20United%20Kingdom%20and%20Australia.%0A%0AI%20fully%20support%20Canada%27s%20efforts%20to%20protect%20national%20security.%20Those%20who%20voluntarily%20joined%20the%20IRGC%20or%20committed%20crimes%20should%20be%20thoroughly%20investigated%20and%20held%20accountable.%20However%2C%20I%20respectfully%20ask%20that%20I%20be%20assessed%20based%20on%20my%20own%20conduct%2C%20rather%20than%20having%20compulsory%20conscription%20treated%20as%20proof%20of%20IRGC%20membership.%0A%0AI%20respectfully%20request%20that%20your%20department%3A%0A%0A-%20Clarify%20that%20mandatory%20conscription%20alone%20does%20not%20establish%20membership%20in%20the%20IRGC.%0A-%20Ensure%20immigration%20officers%20distinguish%20between%20compulsory%20conscription%20and%20voluntary%20membership%20or%20meaningful%20participation%20in%20the%20IRGC.%0A-%20Review%20cases%20in%20which%20former%20conscripts%20have%20been%20found%20inadmissible%20solely%20because%20of%20mandatory%20conscription%20to%20ensure%20that%20Canada%27s%20commitment%20to%20individualized%20assessments%20is%20being%20applied%20consistently.%0A%0ACanada%20has%20long%20been%20recognized%20for%20its%20commitment%20to%20justice%2C%20fairness%2C%20and%20the%20rule%20of%20law.%20I%20respectfully%20ask%20that%20these%20principles%20continue%20to%20guide%20the%20implementation%20of%20the%20IRGC%20listing%20so%20that%20those%20who%20were%20compelled%20to%20serve%20under%20an%20authoritarian%20regime%20are%20not%20treated%20the%20same%20as%20those%20who%20willingly%20chose%20to%20support%20it.%0A%0AThank%20you%20for%20your%20time%20and%20consideration.%20I%20would%20be%20grateful%20for%20any%20assistance%20you%20can%20provide%20and%20would%20welcome%20the%20opportunity%20to%20discuss%20my%20situation%20further.%0A%0ASincerely%2C%0A%5BYour%20Name%5D%0A">tap here to open the email draft</a>.
