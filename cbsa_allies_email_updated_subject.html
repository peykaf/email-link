D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%9C%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%A9%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%A8%F0%9D%90%A7%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%AE%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%AC%20%22%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%A6%F0%9D%90%9B%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%AC%F0%9D%90%A1%F0%9D%90%A2%F0%9D%90%A9%22%20%F0%9D%90%A2%F0%9D%90%A7%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9E%20%F0%9D%90%88%F0%9D%90%91%F0%9D%90%86%F0%9D%90%82.%0A%0AIn%20my%20case%2C%20I%20did%20not%20choose%20to%20join%20the%20IRGC.%20Like%20every%20Iranian%20man%2C%20I%20was%20legally%20required%20to%20complete%20mandatory%20conscription.%20My%20assignment%20was%20quite%20random%3B%20I%20had%20no%20ability%20to%20refuse%20my%20assignment%20and%20no%20ideological%20affiliation%20or%20connection%20to%20that%20organization.%20Yet%20today%2C%20years%20later%2C%20that%20compulsory%20conscription%20is%20being%20treated%20as%20though%20I%20voluntarily%20became%20a%20member%20of%20a%20terrorist%20organization.%0A%0A%F0%9D%90%93%F0%9D%90%A1%F0%9D%90%A2%F0%9D%90%AC%20%F0%9D%90%9A%F0%9D%90%A9%F0%9D%90%A9%F0%9D%90%AB%F0%9D%90%A8%F0%9D%90%9A%F0%9D%90%9C%F0%9D%90%A1%20%F0%9D%90%A2%F0%9D%90%AC%20%F0%9D%90%A2%F0%9D%90%A7%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC%F0%9D%90%A2%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%A7%F0%9D%90%AD%20%F0%9D%90%B0%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%A1%20%F0%9D%90%AD%F0%9D%90%A1%F0%9D%90%9E%20%F0%9D%90%86%F0%9D%90%A8%F0%9D%90%AF%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%A7%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%A7%F0%9D%90%AD%27%F0%9D%90%AC%20%F0%9D%90%9C%F0%9D%90%A8%F0%9D%90%A6%F0%9D%90%A6%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%A6%F0%9D%90%9E%F0%9D%90%A7%F0%9D%90%AD%20%F0%9D%90%AD%F0%9D%90%A8%20%F0%9D%90%A2%F0%9D%90%A7%F0%9D%90%9D%F0%9D%90%A2%F0%9D%90%AF%F0%9D%90%A2%F0%9D%90%9D%F0%9D%90%AE%F0%9D%90%9A%F0%9D%90%A5%F0%9D%90%A2%F0%9D%90%B3%F0%9D%90%9E%F0%9D%90%9D%2C%20%F0%9D%90%9C%F0%9D%90%9A%F0%9D%90%AC%F0%9D%90%9E-%F0%9D
